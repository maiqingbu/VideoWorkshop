name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"
  JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
  JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Strip Aliyun mirrors (use google()/mavenCentral() directly on CI)
        run: |
          echo "=== original settings.gradle.kts ==="
          cat settings.gradle.kts
          sed -i.bak '/maven.aliyun.com/d' settings.gradle.kts
          rm -f settings.gradle.kts.bak
          echo "=== patched settings.gradle.kts ==="
          cat settings.gradle.kts

      - name: Strip local proxy from gradle.properties (no proxy on CI runner)
        run: |
          echo "=== original gradle.properties ==="
          cat gradle.properties
          sed -i.bak -E '/^systemProp\.(http|https)\.(proxyHost|proxyPort|nonProxyHosts)=/d' gradle.properties
          rm -f gradle.properties.bak
          echo "=== patched gradle.properties ==="
          cat gradle.properties

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --no-configuration-cache

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace --no-configuration-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoWorkshop-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
