name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"
  JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
  JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Use official Maven repos (remove Aliyun mirrors for CI)
        run: |
          # Strip Aliyun mirror lines so CI uses google()/mavenCentral()/gradlePluginPortal() directly
          sed -i.bak '/maven.aliyun.com/d' settings.gradle.kts
          rm -f settings.gradle.kts.bak
          echo "=== patched settings.gradle.kts ==="
          cat settings.gradle.kts

      - name: Verify Google Maven accessible
        run: |
          echo "=== test AGP 8.7.3 POM ==="
          curl -sSI --max-time 15 https://dl.google.com/android/maven2/com/android/application/com.android.application.gradle.plugin/8.7.3/com.android.application.gradle.plugin-8.7.3.pom | head -3
          echo "=== test mavenCentral ==="
          curl -sSI --max-time 15 https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.0.21/kotlin-stdlib-2.0.21.pom | head -3

      - name: Build debug APK (use installed gradle, bypass wrapper download)
        run: gradle :app:assembleDebug --no-daemon --stacktrace --no-configuration-cache --info 2>&1 | tee build.log; tail -200 build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoWorkshop-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
